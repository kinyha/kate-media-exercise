services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: counters
      POSTGRES_USER: counters
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counters -d counters"]
      interval: 2s
      timeout: 3s
      retries: 30

  certificates:
    image: eclipse-temurin:21-jdk-jammy
    entrypoint: ["sh", "/scripts/generate-certs.sh"]
    environment:
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-local-development-only}
    volumes:
      - ./scripts/generate-certs.sh:/scripts/generate-certs.sh:ro
      - certificates:/certs

  server:
    build: .
    image: katemedia-counters:local
    init: true
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      DB_URL: jdbc:postgresql://db:5432/counters
      DB_USER: counters
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      TLS_KEYSTORE_PATH: /certs/server.p12
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-local-development-only}
      TLS_CA_CERT: /certs/server.crt
      API_BASE_URL: https://localhost:8443
    volumes:
      - certificates:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      certificates:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/client/bin/client", "health"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 3
    stop_grace_period: 20s

  client:
    image: katemedia-counters:local
    profiles: ["tools"]
    entrypoint: ["/app/client/bin/client"]
    command: ["demo"]
    environment:
      API_BASE_URL: https://server:8443
      TLS_CA_CERT: /certs/server.crt
    volumes:
      - certificates:/certs:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  certificates:
